services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: factum
    volumes: [postgres_data:/var/lib/postgresql/data]
  directus:
    image: directus/directus:11
    restart: unless-stopped
    ports: ['127.0.0.1:8055:8055']
    depends_on: [database]
    environment:
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET in .env}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: factum
      DB_USER: factum
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?Set DIRECTUS_ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?Set DIRECTUS_ADMIN_PASSWORD in .env}
      PUBLIC_URL: http://localhost:8055
    volumes: [directus_uploads:/directus/uploads]
volumes:
  postgres_data:
  directus_uploads:
